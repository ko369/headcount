<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StartupFile — 日本のスタートアップ企業情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;1,6..72,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ─ ベース ─ */
  --bg:   #ffffff;
  --bg2:  #F8F9FA;
  --bg3:  #EEF1F5;
  --line: #E8E8E8;
  --line2: #C0CAD5;
  --text:  #1A1A1A;
  --text2: #555555;
  --text3: #A0A0A0;

  /* ─ スレートグレー（UI基調） ─ */
  --slate:       #5A6A80;
  --slate-dark:  #3A4A5C;
  --slate-light: #EEF1F5;
  --slate-mid:   #C0CAD5;

  /* ─ 企業カラー ─ */
  --smarthr: #E8A020;
  --smarthr-light: #FEF8EE;
  --smarthr-mid:   #F5D090;
  --layerx:  #3BAA90;
  --layerx-light:  #EDFAF6;
  --layerx-mid:    #90D8C0;
  --ubie:    #5B8FCC;
  --ubie-light:    #EEF4FC;
  --ubie-mid:      #A8C8F0;

  /* ─ タグカラー ─ */
  --tag-ok-bg:    #EAF5F0; --tag-ok-c:    #1A7A50; --tag-ok-b:    #A8D8C0;
  --tag-est-bg:   #FEF8EC; --tag-est-c:   #9A6800; --tag-est-b:   #F0D590;
  --tag-press-bg: #FDF0F0; --tag-press-c: #9A3030; --tag-press-b: #E8B8B8;
  --tag-note-bg:  #EFF6FF; --tag-note-c:  #2A5CA8; --tag-note-b:  #B8D0F0;
  --tag-web-bg:   #F5F0FF; --tag-web-c:   #6040A0; --tag-web-b:   #C8B0E8;

  /* ─ 後方互換（旧カラー参照を置き換え） ─ */
  --amber:      #E8A020;
  --amber2:     #B87010;
  --amber-dim:  rgba(232,160,32,0.08);
  --teal:       #3BAA90;
  --rose:       #C04040;
  --blue:       #5B8FCC;
  --font-serif: 'Newsreader', 'Noto Serif JP', serif;
  --font-mono:  'JetBrains Mono', monospace;
}

html, body { height: 100%; }
body {
  background: var(--bg2);
  color: var(--text);
  font-family: 'Noto Sans JP', 'Noto Serif JP', sans-serif;
  line-height: 1.6;
  overflow: auto;
}

/* Layout */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: auto auto;
  min-height: 100vh;
  width: 100%;
}

/* Header */
.header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  padding: 0 28px;
  height: 56px;
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 32px;
}
.logo {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--slate-dark);
}
.logo span { color: var(--text3); font-size: 11px; letter-spacing: 0.06em; display: block; margin-top: 1px; }
.logo-icon { width:26px; height:26px; background:var(--slate-dark); border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:8px; }
.logo-icon span { color:#fff; font-size:9px; font-weight:500; letter-spacing:0.02em; display:block; margin:0; }
.header-divider { width: 1px; height: 24px; background: var(--line2); }
.header-meta { font-family: 'Noto Sans JP', sans-serif; font-size: 10px; color: var(--text3); letter-spacing: 0.02em; }
.header-meta strong { color: var(--text2); font-weight: 400; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.source-badge { display:none; }
.main-mission {
  margin-top: 8px;
  font-size: 11px;
  color: var(--text2);
  line-height: 1.7;
  max-width: 720px;
}
.company-summary-line {
  margin-top: 6px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.01em;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--slate); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line);
  padding: 24px 0;
  background: #fff;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
  align-self: start;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }

.sidebar-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 20px 12px;
}

.company-card {
  padding: 14px 20px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.18s;
  position: relative;
}
.company-card:hover { background: var(--bg3); }
.company-card.active {
  background: var(--bg2);
  border-left-color: var(--slate);
}
.company-card.active[data-color='smarthr'] { background:var(--smarthr-light); border-left-color:var(--smarthr); }
.company-card.active[data-color='layerx']  { background:var(--layerx-light);  border-left-color:var(--layerx);  }
.company-card.active[data-color='ubie']    { background:var(--ubie-light);    border-left-color:var(--ubie);    }
.company-name {
  font-size: 13px;
  font-weight: 500;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.company-badge {
  font-family: var(--font-mono);
  font-size: 8px;
  padding: 1px 6px;
  background: var(--slate-light);
  color: var(--slate);
  letter-spacing: 0.04em;
  border-radius: 20px;
  border: 1px solid var(--slate-mid);
}
.company-card.active .company-badge { background: rgba(240,167,50,0.15); color: var(--amber2); }
.company-stats {
  display: flex;
  gap: 16px;
  margin-top: 6px;
}
.stat { font-family: 'Noto Sans JP', sans-serif; font-size: 10px; color: var(--text3); }
.stat-val { color: var(--slate-dark); font-size: 11px; }
.stat-label { font-size: 9px; color: var(--text3); margin-top: 1px; }
.sparkline-wrap { margin-top: 8px; height: 24px; }

/* mini sparkline canvas */
.spark { width: 100%; height: 24px; opacity: 0.7; }

.sidebar-divider { height: 1px; background: var(--line); margin: 16px 0; }
.add-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  color: var(--text3);
  cursor: pointer;
  transition: color 0.15s;
  letter-spacing: 0.02em;
}
.add-btn:hover { color: var(--amber); }
.add-icon { width: 14px; height: 14px; border: 1px solid currentColor; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }

/* Main */
.main { overflow: visible; display: flex; flex-direction: column; min-width: 0; }

/* Main header strip */
.main-header {
  padding: 16px 28px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
}
.company-title {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 24px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.2;
}
.company-subtitle {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.02em;
  margin-top: 4px;
}
.metric-row {
  display: flex;
  gap: 32px;
  align-items: flex-end;
}
.metric-block { text-align: right; }
.metric-val {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 26px;
  font-weight: 500;
  color: var(--slate-dark);
  line-height: 1;
}
.metric-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.02em;
  margin-top: 4px;
}
.metric-change {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  color: var(--teal);
  margin-top: 2px;
}
.metric-change.neg { color: var(--rose); }

/* Chart area */
.chart-area {
  padding: 16px 32px 0;
  position: relative;
  height: 270px;
  flex-shrink: 0;
}
.chart-wrap {
  width: 100%;
  height: 240px;
  position: relative;
}

/* Year range selector */
.range-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 32px;
  margin-bottom: 4px;
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
}
.range-btn {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 9px;
  padding: 4px 12px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text3);
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.15s;
  border-radius: 20px;
}
.range-btn:hover { border-color: var(--slate); color: var(--slate); }
.range-btn.active { border-color: var(--slate-dark); color: #fff; background: var(--slate-dark); border-radius: 20px; }

/* Data table */
.data-table-wrap {
  flex-shrink: 0;
  border-top: none;
  padding: 0 32px;
  max-height: none;
  overflow-y: visible;
  overflow-x: auto;
}
.data-table-wrap::-webkit-scrollbar { height: 4px; width: 4px; }
.data-table-wrap::-webkit-scrollbar-thumb { background: var(--line2); }
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
}
.data-table th {
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: left;
  padding: 10px 0 8px;
  border-bottom: 1.5px solid var(--slate-mid);
  font-weight: 500;
  font-family: 'Noto Sans JP', sans-serif;
  position: sticky;
  top: 0;
  background: var(--bg2);
}
.data-table td {
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  color: var(--text2);
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table td.year { color: var(--text); font-weight: 400; width: 60px; }
.data-table td.count { color: var(--amber); font-size: 13px; width: 100px; }
.data-table td.src { color: var(--text3); font-size: 10px; }
.data-table td.src a { color: var(--blue); text-decoration: none; }
.src-link {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 8px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--blue) !important;
  font-size: 10px;
  text-decoration: none !important;
  transition: background 0.12s, border-color 0.12s;
  margin-left: 2px;
}
.src-link:hover { background: var(--amber-dim); border-color: var(--amber); color: var(--amber) !important; }
.data-table td.src a:hover { color: var(--amber); text-decoration: underline; }
.est-tag {
  display: inline-block;
  font-size: 8px;
  padding: 1px 6px;
  background: var(--tag-est-bg);
  color: var(--tag-est-c);
  border: 1px solid var(--tag-est-b);
  margin-left: 4px;
  vertical-align: middle;
  border-radius: 20px;
}
.verified-tag {
  display: inline-block;
  font-size: 8px;
  padding: 1px 6px;
  background: var(--tag-ok-bg);
  color: var(--tag-ok-c);
  border: 1px solid var(--tag-ok-b);
  margin-left: 4px;
  vertical-align: middle;
  border-radius: 20px;
}
/* 複数ソース対応スタイル */
.multi-src-row td { border-bottom: none !important; padding-bottom: 2px !important; }
.src-sub-row td {
  padding-top: 3px !important;
  padding-bottom: 3px !important;
  border-bottom: none !important;
}
.src-sub-row:last-of-type td { border-bottom: 1px solid var(--line) !important; }
.src-line {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
}
.src-line .src-bullet {
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: var(--text3);
  border: 1px solid var(--line2);
  border-radius: 20px;
  margin-top: 0px;
}
.src-line.primary .src-bullet { color: var(--amber); border-color: rgba(240,167,50,0.3); }
.src-line .src-text { flex: 1; line-height: 1.4; }
.src-method-tag {
  font-family: var(--font-mono);
  font-size: 8px;
  padding: 1px 5px;
  background: var(--bg3);
  color: var(--text3);
  border: 1px solid var(--line2);
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.src-method-tag.wayback { border-color: var(--tag-web-b); color: var(--tag-web-c); background: var(--tag-web-bg); }
.src-method-tag.note { border-color: var(--tag-note-b); color: var(--tag-note-c); background: var(--tag-note-bg); }
.src-method-tag.press { border-color: var(--tag-press-b); color: var(--tag-press-c); background: var(--tag-press-bg); }
.multi-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 8px;
  padding: 1px 6px 1px 4px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line2);
  border-radius: 20px;
  color: var(--text2);
  margin-left: 6px;
  vertical-align: middle;
}
.multi-badge .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.7; }
.count-range {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
  margin-top: 2px;
}
.conflict-icon { color: var(--amber2); font-size: 9px; margin-left: 4px; }

/* 資金調達バッジ */
.funding-cell { font-family: var(--font-mono); font-size: 10px; }
.funding-round {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border-radius: 20px;
  background: rgba(130,70,180,0.08);
  border: 1px solid rgba(130,70,180,0.2);
}
.funding-round .round-label {
  font-size: 9px;
  color: var(--slate-dark);
  letter-spacing: 0.06em;
  font-weight: 400;
}
.funding-round .round-amount {
  font-size: 11px;
  color: var(--slate-dark);
}
.funding-round .round-unit { font-size: 9px; color: var(--slate); }
.funding-none { color: var(--text3); font-size: 10px; }
.funding-toggle.active { border-color: var(--slate-dark); color: var(--slate-dark); background: rgba(176,106,219,0.08); }

/* Bottom bar */
.bottom-bar {
  padding: 8px 32px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 24px;
  flex-shrink: 0;
}
.bottom-note { font-family: 'Noto Sans JP', sans-serif; font-size: 9px; color: var(--text3); letter-spacing: 0.02em; }
.bottom-note strong { color: var(--text2); font-weight: 400; }
.legend { display: flex; gap: 16px; margin-left: auto; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 5px; font-family: 'Noto Sans JP', sans-serif; font-size: 9px; color: var(--text3); letter-spacing: 0.02em; }
.legend-line { width: 16px; height: 2px; }
.legend-dash { width: 16px; height: 1px; border-top: 1px dashed var(--text3); }

/* Events timeline */
.events-strip {
  flex-shrink: 0;
  border-top: none;
  padding: 0 32px;
  height: 160px;
  position: relative;
}
.events-strip-inner {
  display: flex;
  align-items: flex-start;
  gap: 0;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line2) transparent;
  padding: 12px 0 10px;
}
.events-strip-inner::-webkit-scrollbar { height: 3px; }
.events-strip-inner::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }

.event-year-col {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 36px;
  margin-right: 12px;
}
.event-year-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.06em;
  padding: 0 0 6px;
  border-bottom: 1px solid var(--line2);
  margin-bottom: 8px;
  white-space: nowrap;
  transition: color 0.15s;
}
.event-year-col.highlighted .event-year-label {
  color: var(--company-color, var(--amber));
  border-bottom-color: var(--company-color, var(--amber));
}
.event-cards-col {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 220px;
  max-width: 260px;
  margin-right: 24px;
}
.event-card {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: default;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  overflow: hidden;
}
.event-card.has-url { cursor: pointer; }
.event-card.has-url:hover { border-color: var(--line2); background: var(--bg3); }
.event-card.highlighted { border-color: rgba(240,167,50,0.3); background: rgba(240,167,50,0.04); }
/* 左端のカラーバー */
.event-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: transparent;
  transition: background 0.15s;
}
.event-card.interview::before { background: var(--tag-ok-c); }
.event-card.product::before   { background: var(--tag-note-c); }
.event-card.org::before       { background: var(--slate); }
.event-card.award::before     { background: var(--tag-press-c); }
.event-card.media::before     { background: var(--tag-press-c); }

/* カードヘッダー行 */
.event-card-header {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.event-card-type {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  padding: 1px 5px;
  border-radius: 20px;
  display: inline-block;
  flex-shrink: 0;
}
.event-card-type.interview { background: var(--tag-ok-bg); color: var(--tag-ok-c); border: 1px solid var(--tag-ok-b); }
.event-card-type.product   { background: var(--tag-note-bg); color: var(--tag-note-c); border: 1px solid var(--tag-note-b); }
.event-card-type.org       { background: var(--slate-light); color: var(--slate-dark); border: 1px solid var(--slate-mid); }
.event-card-type.award     { background: rgba(176,106,219,0.1); color: var(--slate-dark); border: 1px solid rgba(176,106,219,0.2); }
.event-card-type.media     { background: var(--tag-press-bg); color: var(--tag-press-c); border: 1px solid var(--tag-press-b); }
.event-card-source {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text3);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.event-card-source.verified { color: var(--teal); }
.event-card-date {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text3);
  margin-left: auto;
  flex-shrink: 0;
}
/* タイトル */
.event-card-title {
  font-size: 11px;
  color: var(--text);
  line-height: 1.35;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 400;
  margin-bottom: 4px;
}
/* 引用 */
.event-card-quote {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 9.5px;
  color: var(--text2);
  line-height: 1.5;
  border-left: 2px solid var(--line2);
  padding-left: 7px;
  margin: 4px 0;
}
.event-card-quote .quote-attr {
  font-style: normal;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text3);
  display: block;
  margin-top: 2px;
}
/* 説明文 */
.event-card-desc {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  line-height: 1.4;
  margin-top: 3px;
}
/* リンク */
.event-card-link {
  font-family: var(--font-mono);
  font-size: 8.5px;
  color: var(--blue);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-top: 5px;
  opacity: 0.8;
  transition: opacity 0.12s;
}
.event-card-link:hover { opacity: 1; color: var(--amber); }
/* URLなしの場合 */
.event-card-no-url {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text3);
  margin-top: 5px;
  opacity: 0.6;
}
.events-empty {
  display: flex;
  align-items: center;
  height: 100%;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
}

/* Grid overlay */
.chart-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  opacity: 0.4;
}

/* Transition */
.company-card { transition: background 0.15s, border-color 0.15s; }
canvas { transition: opacity 0.3s; }

/* ══════════════════════════════════════
   タブナビゲーション
══════════════════════════════════════ */
.tab-nav {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  padding: 0 32px;
  flex-shrink: 0;
  gap: 0;
}
.tab-nav-btn {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  padding: 10px 16px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  letter-spacing: .02em;
  transition: all .15s;
  margin-bottom: -1px;
  white-space: nowrap;
}
.tab-nav-btn.active { color: var(--slate-dark); border-bottom-color: var(--slate-dark); }
.tab-nav-btn:hover:not(.active) { color: var(--text2); }
.tab-new-badge {
  font-size: 7px;
  padding: 1px 4px;
  border-radius: 20px;
  background: var(--tag-ok-bg);
  color: var(--tag-ok-c);
  border: 1px solid var(--tag-ok-b);
  margin-left: 4px;
  vertical-align: middle;
  font-family: 'Noto Sans JP', sans-serif;
}

/* タブコンテンツ切り替え */
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ══════════════════════════════════════
   給与・評価・求人タブ（v3）
══════════════════════════════════════ */
.people-tab-wrap {
  padding: 24px 32px 40px;
  overflow-y: auto;
}

/* セクション共通 */
.pt-sec { margin-bottom: 32px; }
.pt-sec-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 10px 14px;
  background: var(--bg3);
  border-radius: 6px;
  border-left: 3px solid var(--slate-dark);
  border-bottom: none;
}
.pt-sec-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .02em;
  text-transform: none;
  color: var(--slate-dark);
  font-family: 'Noto Sans JP', sans-serif;
}
.pt-src-pill {
  font-size: 9px;
  padding: 1px 8px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--text3);
  font-family: var(--font-mono);
}
.pt-src-pill a { color: var(--blue); text-decoration: none; }
.pt-src-pill a:hover { text-decoration: underline; }

/* ── 給与グラフ ── */
.salary-chart-wrap {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 22px 14px;
  margin-bottom: 8px;
}
.salary-chart-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.salary-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  color: var(--text3);
  font-family: 'Noto Sans JP', sans-serif;
}
.salary-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.salary-chart-canvas-wrap {
  position: relative;
  height: 260px;
  padding-left: 58px;
  padding-bottom: 30px;
}

/* ── 評価制度ビジュアル ── */
.eval-visual-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 8px;
}
.eval-visual-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-cycle-badge {
  font-size: 9px;
  padding: 2px 9px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--text3);
  font-family: var(--font-mono);
}
.eval-flow-strip {
  display: flex;
  align-items: stretch;
  gap: 0;
  margin-bottom: 16px;
}
.eval-flow-step {
  flex: 1;
  background: var(--bg3);
  padding: 9px 11px;
}
.eval-flow-step:first-child { border-radius: 6px 0 0 6px; }
.eval-flow-step:last-child { border-radius: 0 6px 6px 0; }
.eval-flow-arrow {
  width: 0;
  height: 0;
  border-top: 17px solid transparent;
  border-bottom: 17px solid transparent;
  align-self: center;
  flex-shrink: 0;
  z-index: 1;
}
.eval-step-num {
  font-size: 9px;
  color: var(--text3);
  margin-bottom: 2px;
  font-family: var(--font-mono);
}
.eval-step-title {
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-step-sub {
  font-size: 9px;
  color: var(--text3);
  margin-top: 2px;
  line-height: 1.4;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-axes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.eval-axis-card {
  padding: 10px 12px;
  border-radius: 7px;
  border: 1px solid var(--line);
}
.eval-axis-title {
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-axis-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.eval-axis-body {
  font-size: 10px;
  line-height: 1.6;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-grade-strip {
  display: flex;
  align-items: stretch;
  gap: 4px;
  margin-bottom: 14px;
}
.eval-grade-cell {
  flex: 1;
  background: var(--bg3);
  border-radius: 5px;
  padding: 8px 6px;
  text-align: center;
  border: 1px solid var(--line);
}
.eval-grade-cell.g-mid {
  background: rgba(91,138,204,.08);
  border-color: rgba(91,138,204,.3);
}
.eval-grade-num {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-grade-cell.g-mid .eval-grade-num { color: #3a5e8a; }
.eval-grade-lbl {
  font-size: 9px;
  color: var(--text3);
  margin-top: 3px;
  line-height: 1.3;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-matrix-title {
  font-size: 10px;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 7px;
  font-family: 'Noto Sans JP', sans-serif;
}
.eval-matrix {
  display: grid;
  grid-template-columns: 72px repeat(3, 1fr);
  gap: 3px;
}
.eval-matrix-cell {
  padding: 7px 9px;
  border-radius: 4px;
  font-size: 9px;
  text-align: center;
  line-height: 1.4;
  font-family: 'Noto Sans JP', sans-serif;
}
.em-header { background: var(--bg3); color: var(--text3); font-weight: 500; }
.em-label { background: var(--bg3); color: var(--text3); font-weight: 500; display: flex; align-items: center; justify-content: center; }
.em-body { background: #fff; border: 1px solid var(--line); color: var(--text2); }
.em-hi { background: rgba(91,138,204,.1); border: 1px solid rgba(91,138,204,.3); color: #3a5e8a; }

/* ── 求人票テーブル ── */
.job-table-outer { overflow-x: auto; }
.job-table-v3 {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  table-layout: fixed;
  font-family: 'Noto Sans JP', sans-serif;
}
.job-table-v3 th {
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1.5px solid var(--slate-mid);
  font-weight: 500;
  background: var(--bg2);
  white-space: nowrap;
  font-family: 'Noto Sans JP', sans-serif;
}
.job-table-v3 td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  color: var(--text2);
}
.job-table-v3 tr:last-child td { border-bottom: none; }
.job-table-v3 tr:hover td { background: var(--bg3); }
.jcat-badge {
  display: inline-block;
  font-size: 8px;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  font-family: var(--font-mono);
}
.jcat-eng { background: rgba(91,138,204,.1); color: #3a5e8a; border: 1px solid rgba(91,138,204,.3); }
.jcat-biz { background: var(--tag-ok-bg); color: var(--tag-ok-c); border: 1px solid var(--tag-ok-b); }
.jcat-prd { background: rgba(130,70,180,.08); color: #6040a0; border: 1px solid rgba(130,70,180,.2); }
.jcat-dat { background: var(--bg3); color: var(--slate); border: 1px solid var(--line2); }
.jlv-badge {
  font-size: 8px;
  padding: 1px 6px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--text3);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.jdesc-cell {
  font-size: 10px;
  color: var(--text2);
  line-height: 1.5;
  word-break: keep-all;
}
.jsal-cell { min-width: 160px; }
.jsal-nums {
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  margin-bottom: 3px;
  font-family: 'Noto Sans JP', sans-serif;
}
.jsal-track {
  height: 5px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.jsal-fill {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 3px;
}
.jlink {
  font-size: 9px;
  color: var(--blue);
  text-decoration: none;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.jlink:hover { color: var(--amber); text-decoration: underline; }
.pt-footnote {
  margin-top: 10px;
  padding: 9px 13px;
  background: var(--bg3);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  line-height: 1.6;
}
.pt-footnote strong { color: var(--text2); }

/* ── 参照元行 ── */
.info-source-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 9px;
}
.info-source-lbl {
  color: var(--text3);
  flex-shrink: 0;
}
.info-source-link {
  color: var(--blue);
  text-decoration: none;
}
.info-source-link:hover { text-decoration: underline; color: var(--amber); }
.info-source-links {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

/* ── 情報カードリスト ── */
.info-card-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.info-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 13px 16px;
  border-left: 3px solid var(--slate-mid);
  border-radius: 0 8px 8px 0;
}
.info-card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.info-card-tag {
  font-family: var(--font-mono);
  font-size: 8px;
  padding: 1px 7px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--slate);
  flex-shrink: 0;
}
.info-card-link {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--blue);
  text-decoration: none;
}
.info-card-link:hover { text-decoration: underline; color: var(--amber); }
.info-card-title {
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 5px;
  font-family: 'Noto Sans JP', sans-serif;
  line-height: 1.4;
}
.info-card-body {
  font-size: 10px;
  color: var(--text2);
  line-height: 1.65;
  font-family: 'Noto Sans JP', sans-serif;
}
/* ── 等級定義グリッド ── */
.grade-def-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.grade-def-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
  border-top: 3px solid var(--line2);
}
.grade-def-card.g-active { border-top-color: var(--blue); }
.grade-def-id {
  font-size: 18px;
  font-weight: 500;
  color: var(--slate-dark);
  font-family: 'Noto Sans JP', sans-serif;
  line-height: 1;
  margin-bottom: 2px;
}
.grade-def-card.g-active .grade-def-id { color: #3a5e8a; }
.grade-def-theme {
  font-size: 10px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 7px;
  font-family: 'Noto Sans JP', sans-serif;
}
.grade-def-items {
  list-style: none;
  padding: 0;
  margin: 0;
}
.grade-def-items li {
  font-size: 10px;
  color: var(--text2);
  line-height: 1.55;
  padding-left: 10px;
  position: relative;
  font-family: 'Noto Sans JP', sans-serif;
  margin-bottom: 3px;
}
.grade-def-items li::before {
  content: '·';
  position: absolute;
  left: 0;
  color: var(--text3);
}

/* ── 昇給率グラフ ── */
.raise-chart-wrap {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 20px 10px;
}
.raise-chart {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 120px;
  padding-bottom: 24px;
  position: relative;
  border-bottom: 0.5px solid var(--line2);
}
.raise-bar-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  height: 100%;
  justify-content: flex-end;
  gap: 4px;
}
.raise-bar-col {
  width: 100%;
  max-width: 48px;
  border-radius: 3px 3px 0 0;
  position: relative;
}
.raise-bar-pct {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 500;
  color: var(--slate-dark);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.raise-bar-label {
  font-size: 9px;
  color: var(--text3);
  font-family: var(--font-mono);
  text-align: center;
  margin-top: 4px;
  white-space: nowrap;
}
.raise-chart-legend {
  margin-top: 8px;
  text-align: right;
}

/* ══════════════════════════════════════
   モバイル対応（スマホ・タブレット）
══════════════════════════════════════ */

/* ── タブレット（768px以下） ── */
@media (max-width: 768px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
  }

  /* ヘッダー */
  .header {
    padding: 0 16px;
    height: auto;
    min-height: 52px;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 8px;
    padding-bottom: 8px;
  }
  .header-divider { display: none; }
  .header-meta { font-size: 9px; }
  .header-right { margin-left: auto; gap: 8px; }
  .source-badge { display: none; }

  /* サイドバー：横スクロールバーに変換 */
  .sidebar {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding: 12px 0 8px;
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .sidebar-label { display: none; }
  .sidebar-divider { display: none; }
  .add-btn { display: none; }

  .company-card {
    flex-shrink: 0;
    padding: 8px 14px;
    border-left: none;
    border-bottom: 2px solid transparent;
    min-width: 120px;
    white-space: nowrap;
  }
  .company-card.active {
    background: var(--bg2);
    border-left-color: transparent;
    border-bottom-color: var(--slate);
  }
  .company-card.active[data-color='smarthr'] { background: var(--smarthr-light); border-bottom-color: var(--smarthr); }
  .company-card.active[data-color='layerx']  { background: var(--layerx-light);  border-bottom-color: var(--layerx); }
  .company-card.active[data-color='ubie']    { background: var(--ubie-light);    border-bottom-color: var(--ubie); }
  .company-stats { display: none; }
  .sparkline-wrap { display: none; }
  .company-name { font-size: 12px; }

  /* メインエリア */
  .main-header {
    padding: 12px 16px;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .company-title { font-size: 18px; }
  .metric-row {
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-start;
    width: 100%;
  }
  .metric-block { text-align: left; }
  .metric-val { font-size: 20px; }

  /* タブナビ */
  .tab-nav {
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-nav-btn { font-size: 10px; padding: 10px 10px; white-space: nowrap; }

  /* チャートエリア */
  .chart-area {
    padding: 12px 16px 0;
    height: 220px;
  }
  .chart-wrap { height: 200px; }

  .range-bar { padding: 6px 16px; }

  /* イベントストリップ */
  .events-strip { padding: 0 16px; height: 150px; }
  .event-cards-col { min-width: 180px; max-width: 220px; }

  /* データテーブル */
  .data-table-wrap { padding: 0 16px; }
  .data-table { font-size: 10px; }
  .data-table th { font-size: 8px; padding: 8px 4px 6px; }
  .data-table td { padding: 6px 4px; }
  .data-table td.count { font-size: 11px; }

  /* ボトムバー */
  .bottom-bar {
    padding: 8px 16px;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .legend { margin-left: 0; flex-wrap: wrap; gap: 10px; }

  /* 給与タブ */
  .people-tab-wrap { padding: 16px 16px 40px; }

  /* 評価フロー：縦積みに */
  .eval-flow-strip {
    flex-direction: column;
    gap: 4px;
  }
  .eval-flow-step:first-child { border-radius: 6px 6px 0 0; }
  .eval-flow-step:last-child { border-radius: 0 0 6px 6px; }
  .eval-flow-arrow { display: none; }

  /* 評価軸グリッド：1列に */
  .eval-axes-grid { grid-template-columns: 1fr; }

  /* 等級グリッド：2列に */
  .grade-def-grid { grid-template-columns: repeat(2, 1fr); }

  /* 評価マトリクス：スクロール可 */
  .eval-matrix { font-size: 8px; overflow-x: auto; }
  .eval-matrix-cell { padding: 5px 6px; }

  /* 求人テーブル */
  .job-table-outer { overflow-x: auto; }
  .job-table-v3 { min-width: 520px; }

  /* 給与チャート */
  .salary-chart-canvas-wrap { height: 200px; padding-left: 44px; }

  /* pt-sec-head */
  .pt-sec-head { padding: 8px 10px; }

  /* 各セクション見出し */
  div[style*="padding:14px 32px 0"] {
    padding: 12px 16px 0 !important;
  }
}

/* ── スマートフォン（480px以下） ── */
@media (max-width: 480px) {
  .header { padding: 6px 12px; }
  .logo span { display: none; }

  .main-header { padding: 10px 12px; }
  .company-title { font-size: 16px; }
  .metric-val { font-size: 18px; }
  .metric-val[style*="font-size:22px"] { font-size: 16px !important; }

function renderEventsStrip(company) {
  const strip = document.getElementById('eventsStrip');
  const events = EVENTS[company.name] || [];
  if (!events.length) {
    strip.innerHTML = '<div class="events-empty">この企業のトピックデータはまだありません</div>';
    return;
  }
  const byYear = {};
  events.forEach(e => {
    if (!byYear[e.year]) byYear[e.year] = [];
    byYear[e.year].push(e);
  });
  const years = Object.keys(byYear).map(Number).sort((a,b) => a - b);
  const typeLabel = { interview: 'インタビュー', product: 'プロダクト', org: '組織', award: '受賞', media: 'メディア' };

  strip.innerHTML = years.map(yr => {
    const cards = byYear[yr].map(e => {
      const hasUrl = !!e.url;
      const quoteHTML = e.quote
        ? `<div class="event-card-quote">${e.quote}${e.quoteAttr ? `<span class="quote-attr">― ${e.quoteAttr}</span>` : ''}</div>`
        : '';
      const linkHTML = hasUrl
        ? `<a class="event-card-link" href="${e.url}" target="_blank" rel="noopener">一次情報を読む →</a>`
        : `<span class="event-card-no-url">一次URLなし（要補完）</span>`;
      return `
        <div class="event-card ${e.type}${hasUrl ? ' has-url' : ''}" data-year="${yr}">
          <div class="event-card-header">
            <span class="event-card-type ${e.type}">${typeLabel[e.type] || e.type}</span>
            <span class="event-card-source${hasUrl ? ' verified' : ''}">${e.source || '出典不明'}</span>
            ${e.date ? `<span class="event-card-date">${e.date}</span>` : ''}
          </div>
          <div class="event-card-title">${e.title}</div>
          ${quoteHTML}
          <div class="event-card-desc">${e.desc}</div>
          ${linkHTML}
        </div>`;
    }).join('');
    return `
      <div class="event-year-col" data-year="${yr}">
        <div class="event-year-label">${yr}</div>
      </div>
      <div class="event-cards-col" data-year="${yr}">${cards}</div>`;
  }).join('');
}

function highlightEventYear(year) {
  const strip = document.getElementById('eventsStrip');
  document.querySelectorAll('#eventsStrip [data-year]').forEach(el => {
    const match = parseInt(el.dataset.year) === year;
    if (el.classList.contains('event-year-col')) el.classList.toggle('highlighted', match);
    if (el.classList.contains('event-cards-col')) {
      el.querySelectorAll('.event-card').forEach(c => c.classList.toggle('highlighted', match));
      if (match) {
        // 親のscrollable containerに対してscrollIntoView相当を手動実行
        const parent = strip;
        const elLeft = el.offsetLeft;
        parent.scrollTo({ left: elLeft - 40, behavior: 'smooth' });
      }
    }
  });
}

// Color helper
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function buildSparklines() {
  COMPANIES.forEach((c, i) => {
    const canvas = document.getElementById(`spark${i}`);
    if (!canvas) return;
    const years = c.data.map(d => d.year);
    const counts = c.data.map(d => d.count);
    const chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          data: counts,
          borderColor: c.color,
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
          backgroundColor: c.colorDim,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } },

  });
}

function getFilteredData(company, range) {
  const data = company.data;
  const latestYear = data[data.length - 1].year;
  if (range === 'all') return data;
  const cutoff = range === '5y' ? latestYear - 5 : latestYear - 3;
  return data.filter(d => d.year >= cutoff);
}

function buildMainChart(company, range) {
  const filtered = getFilteredData(company, range);
  const allYears = filtered.map(d => d.year);
  const rgb = hexToRgb(company.color);

  // 表示期間内の資金調達データ
  const minYear = allYears[0], maxYear = allYears[allYears.length - 1];
  const fundingInRange = (company.funding || []).filter(f => f.year >= minYear && f.year <= maxYear);

  // 全年を包括したラベル（資金調達年も含める）
  const allX = [...new Set([...allYears, ...fundingInRange.map(f => f.year)])].sort((a,b)=>a-b);

  // ── 在職者数データセット ──
  const datasets = [
    {
      label: '在職者数（確認済み）',
      data: filtered.map(d => ({ x: d.year, y: d.est ? null : d.count })),
      yAxisID: 'yHead',
      borderColor: company.color,
      backgroundColor: `rgba(${rgb},0.12)`,
      borderWidth: 2,
      pointRadius: filtered.map(d => d.est ? 0 : 5),
      pointBackgroundColor: company.color,
      pointBorderColor: '#ffffff',
      pointBorderWidth: 2,
      tension: 0.25,
      fill: false,
      spanGaps: false,
      order: 2,
    },
    {
      label: '在職者数（推定）',
      data: filtered.map(d => ({ x: d.year, y: d.count })),
      yAxisID: 'yHead',
      borderColor: `rgba(${rgb},0.35)`,
      borderDash: [4,4],
      borderWidth: 1.5,
      pointRadius: filtered.map(d => d.est ? 4 : 0),
      pointBackgroundColor: `rgba(${rgb},0.4)`,
      pointBorderColor: '#ffffff',
      pointBorderWidth: 1,
      tension: 0.25,
      fill: { target: 'origin', above: `rgba(${rgb},0.05)` },
      spanGaps: true,
      order: 2,
    }
  ];

  // ── 資金調達バーデータセット ──
  if (showFunding && fundingInRange.length > 0) {
    datasets.push({
      type: 'bar',
      label: '資金調達額（億円）',
      data: allX.map(x => {
        const f = fundingInRange.find(f => f.year === x);
        return { x, y: f ? f.amount : null };
      }),
      yAxisID: 'yFund',
      backgroundColor: allX.map(x => {
        const f = fundingInRange.find(f => f.year === x);
        return f ? 'rgba(176,106,219,0.45)' : 'transparent';
      }),
      borderColor: allX.map(x => {
        const f = fundingInRange.find(f => f.year === x);
        return f ? 'rgba(176,106,219,0.8)' : 'transparent';
      }),
      borderWidth: 1,
      borderRadius: 3,
      barPercentage: 0.35,
      order: 3,
    });
  }

  if (mainChart) mainChart.destroy();

  // 資金調達の最大値（右軸スケール用）
  const maxFund = fundingInRange.length > 0 ? Math.max(...fundingInRange.map(f => f.amount)) : 100;

  const ctx = document.getElementById('mainChart').getContext('2d');
  mainChart = new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: 'rgba(0,0,0,0.12)',
          borderWidth: 1,
          titleColor: '#A0A0A0',
          bodyColor: '#1A1A1A',
          titleFont: { family: "'Noto Sans JP', sans-serif", size: 10 },
          bodyFont: { family: "'Noto Sans JP', sans-serif", size: 12 },
          boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
          padding: 12,
          callbacks: {
            title: (items) => items[0].parsed.x + '年',
            label: (item) => {
              if (item.parsed.y === null || item.parsed.y === 0) return null;
              if (item.dataset.yAxisID === 'yFund') {
                const f = fundingInRange.find(f => f.year === item.parsed.x);
                const note = f ? ` (${f.round}${f.note ? ' · ' + f.note : ''})` : '';
                return ` 調達 ${item.parsed.y}億円${note}`;
              }
              // 「推定」系列（index=1）は、「確認済み」系列（index=0）に値がある年は非表示
              if (item.datasetIndex === 1) {
                const confirmedDataset = item.chart.data.datasets[0];
                const confirmedPoint = confirmedDataset.data[item.dataIndex];
                if (confirmedPoint && confirmedPoint.y !== null) return null;
              }
              return ` 在職者数 ${item.parsed.y.toLocaleString()} 名`;
            },
            labelColor: (item) => {
              if (item.dataset.yAxisID === 'yFund') return { borderColor: '#b06adb', backgroundColor: 'rgba(176,106,219,0.6)' };
              return { borderColor: company.color, backgroundColor: company.color };
            }
          }
        }
      },
      onHover: (evt, elements) => {
        if (!elements || elements.length === 0) return;
        try {
          const ds = mainChart.data.datasets[elements[0].datasetIndex];
          if (!ds || !ds.data) return;
          const pt = ds.data[elements[0].index];
          if (pt && typeof pt.x === 'number') {
            highlightEventYear(Math.round(pt.x));
          }
        } catch (e) { /* ignore hover errors */ }
      },
      scales: {
        x: {
          type: 'linear',
          min: minYear - 0.3,
          max: maxYear + 0.3,
          ticks: {
            color: '#4a4845',
            font: { family: "'JetBrains Mono', monospace", size: 10 },
            stepSize: 1,
            callback: v => Number.isInteger(v) ? v : '',
          },
          grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
          border: { color: 'rgba(0,0,0,0.08)' },
        },
        yHead: {
          type: 'linear',
          position: 'left',
          ticks: {
            color: '#4a4845',
            font: { family: "'JetBrains Mono', monospace", size: 10 },
            callback: v => v >= 1000 ? v.toLocaleString() : v,
          },
          grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
          border: { color: 'rgba(0,0,0,0.08)' },
        },
        yFund: {
          type: 'linear',
          position: 'right',
          display: showFunding && fundingInRange.length > 0,
          max: maxFund * 2.2,
          ticks: {
            color: 'rgba(90,106,128,0.7)',
            font: { family: "'Noto Sans JP', sans-serif", size: 9 },
            callback: v => v > 0 ? v.toFixed(1) + '億' : '',
            maxTicksLimit: 5,
          },
          grid: { display: false },
          border: { color: 'rgba(90,106,128,0.2)', dash: [4,4] },
        }
      },
      animation: { duration: 400, easing: 'easeInOutQuart' },
    }
  });
}

function updateTable(company) {
  const tbody = document.getElementById('data-tbody');
  const rows = [...company.data].reverse();

  tbody.innerHTML = rows.map(d => {
    const fundings = (company.funding || []).filter(f => f.year === d.year);
    const headcountSources = Array.isArray(d.sources)
      ? d.sources.map(s => ({ ...s, category: '社員数' }))
      : [];
    const fundingSources = fundings.flatMap(f =>
      Array.isArray(f.sources)
        ? f.sources.map(s => ({
            ...s,
            category: f.round ? `資金調達 / ${f.round}` : '資金調達'
          }))
        : []
    );
    const sourceEntries = uniqBy(
      [...headcountSources, ...fundingSources].map(s => ({
        ...s,
        category: s.category && s.category.startsWith('資金調達') ? '資金調達' : s.category
      })).filter(s => s && (s.text || s.method || s.url)),
      s => [s.category || '', s.text || '', s.method || '', s.url || ''].join('|')
    );
    const isMulti = sourceEntries.length > 1;

    const countCell = `
      <td class="count">${d.count.toLocaleString()}</td>`;

    const fundingCell = fundings.length > 0
      ? fundings.map(f => `
          <div class="funding-round" style="margin-bottom:3px">
            <span class="round-label">${f.round}</span>
            <span class="round-amount">${f.amount < 1 ? (f.amount * 100).toFixed(0) + '千万' : f.amount + '億'}</span>
            <span class="round-unit">円</span>
          </div>
          ${f.note ? `<div style="font-family:var(--font-mono);font-size:9px;color:var(--text3);margin-top:2px;line-height:1.4">${f.note}</div>` : ''}
        `).join('')
      : `<span class="funding-none">—</span>`;

    const srcLines = sourceEntries.length > 0
      ? sourceEntries.map((s, idx) => {
          const rawLabel = s.text || s.url || '出典未入力';
          const srcText = s.url
            ? `<a href="${s.url}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${escapeHtml(rawLabel)} ↗</a>`
            : escapeHtml(rawLabel);
          const categoryTag = s.category
            ? `<span class="src-method-tag" style="margin-right:6px">${escapeHtml(s.category)}</span>`
            : '';
          const methodTag = s.method
            ? `<span class="src-method-tag">${escapeHtml(s.method)}</span>`
            : '';
          return `
            <div class="src-line ${idx === 0 && isMulti ? 'primary' : ''}">
              ${isMulti ? `<span class="src-bullet">${idx + 1}</span>` : ''}
              <span class="src-text">${categoryTag}${srcText}</span>
              ${methodTag}
            </div>`;
        }).join('')
      : `<div class="src-line"><span class="src-text" style="color:var(--text3)">—</span></div>`;

    return `
      <tr>
        <td class="year">${d.year}</td>
        ${countCell}
        <td class="funding-cell" style="padding-top:6px;padding-bottom:6px;vertical-align:top">${fundingCell}</td>
        <td class="src" style="padding-top:6px;padding-bottom:6px">
          <div style="display:flex;flex-direction:column;gap:5px">${srcLines}</div>
        </td>
      </tr>`;
  }).join('');
}

function updateMetrics(company) {
  const data = company.data;
  const latest = data[data.length - 1];
  const prev = data.length >= 2 ? data[data.length - 2] : null;
  const peak = data.reduce((a,b) => b.count > a.count ? b : a, data[0]);
  const change = prev ? Math.round((latest.count - prev.count) / prev.count * 100) : null;

  document.getElementById('main-title').textContent = company.name;
  document.getElementById('main-sub').textContent = company.sub;
  const missionEl = document.getElementById('main-mission');
  if (missionEl) {
    const mission = company?.api?.mission || '';
    missionEl.textContent = mission ? `MISSION: ${mission}` : '';
    missionEl.style.display = mission ? 'block' : 'none';
  }
  document.getElementById('metric-current').textContent = latest.count.toLocaleString();
  const COLOR_MAP2 = { 'SmartHR':'var(--smarthr)','LayerX':'var(--layerx)','Ubie':'var(--ubie)' };
  const companyColor = COLOR_MAP2[company.name] || 'var(--slate-dark)';
  document.getElementById('metric-current').style.color = companyColor;
  document.getElementById('metric-peak').textContent = peak.count.toLocaleString();
  document.getElementById('metric-peak-year').textContent = peak.year + '年';
  if (change !== null) {
    const el = document.getElementById('metric-change');
    el.textContent = (change >= 0 ? '+' : '') + change + '% (前年比)';
    el.className = 'metric-change' + (change < 0 ? ' neg' : '');
  }

  // 資金調達サマリー
  const fundings = company.funding || [];
  const totalRaised = fundings.reduce((sum, f) => sum + f.amount, 0);
  const raisedEl = document.getElementById('metric-raised');
  const roundsEl = document.getElementById('metric-rounds');
  if (totalRaised > 0) {
    raisedEl.textContent = '約' + (totalRaised >= 100 ? Math.round(totalRaised) : totalRaised.toFixed(1)) + '億円';
    roundsEl.textContent = fundings.length + 'ラウンド';
  } else {
    raisedEl.textContent = '—';
    roundsEl.textContent = 'データなし';
  }
}

const API_URL = 'https://script.google.com/macros/s/AKfycbw_F6CZ5z9BuhvS4UEUFZMCu0TExhYxOIqBfvzCfSVGFDEj9GxdQ0O74uA8DoGEAMGy7g/exec';

async function loadSiteData() {
  try {
    showLoadingState('JSON APIからデータを読み込み中...');

    const res = await fetch(`${API_URL}?t=${Date.now()}`, {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error(`APIの読み込みに失敗 (HTTP ${res.status})`);
    }

    const payload = await res.json();
    applyApiData(payload);

    const metaEl = document.querySelector('.header-meta');
    if (metaEl && payload.meta) {
      const updated = new Date(payload.meta.generatedAt).toLocaleDateString('ja-JP', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
      metaEl.innerHTML = `<strong>${payload.meta.companyCount}</strong> 企業 &nbsp;·&nbsp; 更新: <strong>${updated}</strong>`;
    }

    showDataBadge('JSON API連携', 'loaded');
    showLoadingState('');
  } catch (e) {
    console.warn('[API] 読み込みに失敗しました:', e.message);
    showLoadingState('');
    showDataBadge('手動入力データ（フォールバック）', 'fallback');
  }
}

function applyApiData(payload) {
  const companies = Array.isArray(payload?.companies) ? payload.companies : [];
  const apiByName = Object.fromEntries(companies.map(c => [c.name, c]));

  COMPANIES.forEach(company => {
    const api = apiByName[company.name];
    if (!api) return;
    applyCompanyApiData(company, api);
  });

  companies.forEach(api => {
    if (COMPANIES.find(c => c.name === api.name)) return;
    const company = {
      id: api.id || slugify(api.name),
      name: api.name,
      sub: buildCompanySub(api),
      sector: api.sector || '',
      founding_year: api.foundingYear || null,
      color: api.color || '#888780',
      colorDim: makeColorDim(api.color || '#888780'),
      funding: normalizeFunding(api.funding || []),
      data: normalizeHeadcounts(api.headcounts || []),
      api: api
    };
    COMPANIES.push(company);
    EVENTS[api.name] = normalizeTopics(api.topics || []);
  });
}

function applyCompanyApiData(company, api) {
  company.id = api.id || company.id || slugify(api.name || company.name);
  company.name = api.name || company.name;
  company.sector = api.sector || company.sector || '';
  company.founding_year = api.foundingYear || company.founding_year || null;
  company.sub = buildCompanySub(api) || company.sub || '';
  if (api.color) {
    company.color = api.color;
    company.colorDim = makeColorDim(api.color);
  }
  if (Array.isArray(api.headcounts) && api.headcounts.length > 0) {
    company.data = normalizeHeadcounts(api.headcounts);
  }
  if (Array.isArray(api.funding)) {
    company.funding = normalizeFunding(api.funding);
  }
  if (Array.isArray(api.topics)) {
    EVENTS[company.name] = normalizeTopics(api.topics);
  }
  company.api = api;
}

function buildCompanySub(api) {
  const bits = [];
  if (api.foundingYear) bits.push(`設立 ${api.foundingYear}年`);
  if (api.sector) bits.push(api.sector);
  if (api.location) bits.push(api.location);
  return bits.join(' · ');
}

function normalizeHeadcounts(items) {
  return (items || []).map(d => ({
    year: Number(d.year) || 0,
    count: Number(d.count) || 0,
    est: !!d.est || (d.source_method || '') === '推算',
    sources: Array.isArray(d.sources) && d.sources.length > 0
      ? d.sources.map(s => ({
          text: s.text || '',
          method: s.method || '',
          type: s.type || 'default',
          url: s.url || ''
        }))
      : [{
          text: d.source_text || '',
          method: d.source_method || '',
          type: d.source_type || 'default',
          url: d.source_url || ''
        }]
  })).filter(d => d.year).sort((a, b) => a.year - b.year);
}

function normalizeFunding(items) {
  return (items || []).map(f => ({
    year: Number(f.year) || 0,
    round: f.round || '',
    amount: Number(f.amount) || 0,
    note: f.note || '',
    sources: Array.isArray(f.sources) && f.sources.length > 0
      ? f.sources.map(s => ({
          text: s.text || '',
          method: s.method || '',
          type: s.type || 'default',
          url: s.url || ''
        }))
      : []
  })).filter(f => f.year).sort((a, b) => a.year - b.year);
}

function normalizeTopics(items) {
  return (items || []).map(t => ({
    year: Number(t.year) || 0,
    type: t.type || 'org',
    title: t.title || '',
    source: t.source || '',
    date: t.date || '',
    quote: t.quote || '',
    quoteAttr: t.quoteAttr || '',
    desc: t.desc || '',
    url: t.url || ''
  })).filter(t => t.year).sort((a, b) => a.year - b.year);
}

function makeColorDim(hex) {
  const m = String(hex || '').trim().match(/^#?([0-9a-fA-F]{6})$/);
  if (!m) return 'rgba(136,135,128,0.15)';
  const v = m[1];
  const r = parseInt(v.slice(0,2), 16);
  const g = parseInt(v.slice(2,4), 16);
  const b = parseInt(v.slice(4,6), 16);
  return `rgba(${r},${g},${b},0.15)`;
}

function slugify(str) {
  return String(str || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'company';
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatManYen(v) {
  if (v === null || v === undefined || v === '' || Number.isNaN(Number(v))) return '—';
  return `${Number(v).toLocaleString('ja-JP')}万円`;
}

function formatPeopleCount(v) {
  if (v === null || v === undefined || v === '' || Number.isNaN(Number(v))) return '—';
  return `${Number(v).toLocaleString('ja-JP')}名`;
}

function uniqBy(items, keyFn) {
  const seen = new Set();
  return items.filter(item => {
    const key = keyFn(item);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function renderDynamicSalaryChart(area, rows) {
  if (!area || !rows.length) return;

  const maxY = Number(rows.find(r => r.graphMax)?.graphMax) || Math.ceil(Math.max(...rows.map(r => Number(r.max) || 0)) / 100) * 100;
  const CHART_H = 220;
  const CHART_XPAD = 62;

  area.style.paddingLeft = `${CHART_XPAD}px`;
  area.style.overflow = 'visible';

  const plot = document.createElement('div');
  plot.style.cssText = `position:absolute;left:${CHART_XPAD}px;top:0;right:0;height:${CHART_H}px;border-left:0.5px solid var(--line2);border-bottom:0.5px solid var(--line2);overflow:visible`;
  area.appendChild(plot);

  const tickCount = 4;
  const tickStep = Math.ceil(maxY / tickCount / 100) * 100;
  const ticks = Array.from({length: tickCount + 1}, (_, i) => i * tickStep).filter(v => v <= maxY);
  if (ticks[ticks.length - 1] !== maxY) ticks.push(maxY);

  ticks.forEach(v => {
    const px = CHART_H - Math.round(v / maxY * CHART_H);
    const g = document.createElement('div');
    g.style.cssText = `position:absolute;left:0;right:0;top:${px}px;border-top:0.5px dashed var(--line)`;
    plot.appendChild(g);

    const t = document.createElement('div');
    t.style.cssText = `position:absolute;right:100%;padding-right:6px;top:${px-7}px;font-size:9px;color:var(--text3);font-family:var(--font-mono);white-space:nowrap`;
    t.textContent = v === 0 ? '0' : String(v);
    plot.appendChild(t);
  });

  const yu = document.createElement('div');
  yu.style.cssText = 'position:absolute;right:100%;padding-right:6px;top:-14px;font-size:9px;color:var(--text3);font-family:var(--font-mono)';
  yu.textContent = '万円';
  plot.appendChild(yu);

  const groups = [];
  const map = new Map();
  rows.forEach(r => {
    const key = r.gradeId || r.gradeLabel || `g${groups.length}`;
    if (!map.has(key)) {
      map.set(key, { key, label: r.gradeLabel || r.gradeId || '', items: [] });
      groups.push(map.get(key));
    }
    map.get(key).items.push(r);
  });

  const nG = groups.length;
  groups.forEach((grp, i) => {
    const slotW = 1 / nG;
    const leftPct = (i / nG + slotW * 0.08) * 100;
    const widthPct = slotW * 0.84 * 100;
    const container = document.createElement('div');
    container.style.cssText = `position:absolute;bottom:0;left:${leftPct}%;width:${widthPct}%;height:${CHART_H}px;overflow:visible`;

    grp.items.forEach((item, j) => {
      const innerCount = grp.items.length;
      const innerW = 100 / innerCount;
      const left = j * innerW + innerW * 0.1;
      const width = innerW * 0.8;
      const min = Number(item.min) || 0;
      const max = Number(item.max) || 0;
      const barBottom = Math.round(min / maxY * CHART_H);
      const barH = Math.max(2, Math.round((max - min) / maxY * CHART_H));
      const bar = document.createElement('div');
      bar.style.cssText = `position:absolute;bottom:${barBottom}px;left:${left}%;width:${width}%;height:${barH}px;background:${item.color || '#5A6A80'};opacity:0.82;border-radius:2px 2px 0 0`;
      bar.title = `${item.gradeLabel || item.gradeId || ''} ${item.series || ''} ${min}〜${max}万円`;

      const topLabel = document.createElement('div');
      topLabel.style.cssText = 'position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--text3);font-family:var(--font-mono);white-space:nowrap';
      topLabel.textContent = max;
      bar.appendChild(topLabel);

      if (item.memberCount) {
        const cnt = document.createElement('div');
        cnt.style.cssText = 'position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:8px;color:var(--text2);font-family:var(--font-mono);white-space:nowrap';
        cnt.textContent = `${Number(item.memberCount).toLocaleString('ja-JP')}名`;
        bar.appendChild(cnt);
      }
      container.appendChild(bar);
    });

    const xl = document.createElement('div');
    xl.style.cssText = 'position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text2);font-family:var(--font-sans);white-space:nowrap;text-align:center';
    xl.textContent = grp.label || grp.key;
    container.appendChild(xl);
    plot.appendChild(container);
  });
}

    var col = barCol[j.cat] || '#5A6A80';
    var salHtml = hasSal
      ? '<div class="jsal-nums">'+j.salMin+'〜'+j.salMax+'万円</div>' +
        '<div class="jsal-track"><div class="jsal-fill" style="left:'+fillLeft+'%;width:'+fillWidth+'%;background:'+col+';opacity:0.75"></div></div>'
      : '<div class="jsal-nums">非公開</div>';
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><span class="jcat-badge '+(catStyle[j.cat]||'jcat-dat')+'">'+j.lbl+'</span></td>' +
      '<td style="font-size:11px;color:var(--text);font-weight:500;font-family:Noto Sans JP,sans-serif">'+j.pos+'</td>' +
      '<td><span class="jlv-badge">'+j.lv+'</span></td>' +
      '<td class="jdesc-cell">'+j.desc+'</td>' +
      '<td class="jsal-cell">'+salHtml+'</td>' +
      '<td><a class="jlink" href="'+j.url+'" target="_blank">↗</a></td>';
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  sec.appendChild(wrap);
  el.appendChild(sec);
}

</script>
</body>
</html>
